name: Pipeline CI/CD Web Scraping Laptops

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # FASE 1: Integración Continua (Pruebas y Artefacto CSV)
  ci-build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Clonar repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Ejecutar pruebas unitarias (Scraper y App Flask)
        run: |
          python -m pytest tests/
        env:
          PYTHONPATH: .

      - name: 5. Generar dataset CSV de respaldo
        run: |
          python src/scraper.py

      - name: 6. Publicar Artefacto CSV
        uses: actions/upload-artifact@v4
        with:
          name: dataset-laptops-csv
          path: laptops_extracted.csv

  # FASE 2: Despliegue Continuo en la Nube (Render)
  cd-deploy-production:
    needs: ci-build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Disparar Deploy Hook en Render
        run: |
          curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
